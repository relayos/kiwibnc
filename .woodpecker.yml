when:
  - event: [push, pull_request]
    branch: [master]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true
      depth: 0

steps:
  - name: validation
    image: node:20-alpine
    commands:
      - npm ci
      - ./node_modules/.bin/jest tests/unit/custom-modules-packaging.js tests/unit/docker-entrypoint.js tests/unit/routes-client.js tests/unit/routes-oauth.js tests/unit/users.js --runInBand

  - name: test-build
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: ghcr.io
      repo: ghcr.io/relayos/kiwibnc
      dockerfile: Dockerfile
      context: .
      dry_run: true
      tags:
        - local-test-${CI_COMMIT_SHA:0:7}

  - name: publish-image
    image: woodpeckerci/plugin-docker-buildx
    when:
      event: [push]
      branch: [master]
    settings:
      registry: ghcr.io
      repo: ghcr.io/relayos/kiwibnc
      dockerfile: Dockerfile
      context: .
      tags:
        - latest
        - sha-${CI_COMMIT_SHA:0:7}
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
