when:
  - event: [push, pull_request]
    branch: [relayos]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true
      depth: 0

steps:
  - name: test-build
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: ghcr.io
      repo: ghcr.io/relayos/kiwibnc
      dockerfile: Dockerfile
      context: .
      dry_run: true
      tags:
        - local-test-${CI_COMMIT_SHA:0:7}

  - name: publish-image
    image: woodpeckerci/plugin-docker-buildx
    when:
      event: [push]
      branch: [relayos]
    settings:
      registry: ghcr.io
      repo: ghcr.io/relayos/kiwibnc
      dockerfile: Dockerfile
      context: .
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:7}
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
